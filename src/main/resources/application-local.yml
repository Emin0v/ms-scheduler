server:
  port: 8085

spring:
  application:
    name: ms-scheduler

  mvc:
    path-match:
      matching-strategy: ant_path_matcher

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    stream:
      bindings:
        notificationEventProducer-out-0: # Should be changed to your actual producer name
          destination: ns.scheduler.dx # Should be changed to your actual exchange name
          content-type: application/json
      rabbit:
        bindings:
          notificationEventProducer-out-0:
            producer:
              routing-key-expression: "headers['routingKey']"
              exchange-type: direct
              bind-queue: false
              declare-exchange: false

  liquibase:
    change-log: classpath:liquibase/changelog-master.yaml

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/db_scheduler
    username: postgres
    password: postgres
    hikari:
      pool-name: MsSchedulerHikariPool
      auto-commit: false
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.enable_lazy_load_no_trans: true
      hibernate.default_schema: public

  quartz:
    job-store-type: jdbc
    properties:
      org:
        quartz:
          scheduler:
            instanceName: Scheduler
            instanceId: AUTO
          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: QRTZ_
            dataSource: quartzDataSource
            isClustered: true
            clusterCheckinInterval: 20000
          threadPool:
            threadCount: 10
          dataSource:
            quartzDataSource:
              provider: hikaricp
              driver: ${spring.datasource.driver-class-name}
              URL: ${spring.datasource.url}
              user: ${spring.datasource.username}
              password: ${spring.datasource.password}

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    propagation:
      type: b3_multi
    sampling:
      probability: 1.0